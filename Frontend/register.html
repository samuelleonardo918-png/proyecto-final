<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        if (location.protocol === 'file:') {
            location.replace('http://localhost:3000/register');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sweet Freeze</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <h1 class="logo login-logo">Sweet Freeze</h1>
            <h2 style="color: #ffffff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Crear cuenta</h2>
            <p style="color: #ffffff !important;">Completa tus datos para registrarte</p>

            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" class="btn-login">Registrarse</button>
            </form>
            <p class="signup-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            <a href="index.html" class="back-home">← Volver al inicio</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
