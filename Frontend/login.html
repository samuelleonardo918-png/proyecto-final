<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        if (location.protocol === 'file:') {
            location.replace('http://localhost:3000/login');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sweet Freeze</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <h1 class="logo login-logo">Sweet Freeze</h1>
            <h2 style="color: #ffffff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Bienvenido de vuelta</h2>
            <p style="color: #ffffff !important;">Ingresa tus datos para continuar</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Recuérdame
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            <p class="signup-link">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
            <a href="index.html" class="back-home">← Volver al inicio</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
